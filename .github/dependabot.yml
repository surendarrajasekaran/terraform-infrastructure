version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/apps/onboard/aws, /apps/onboard/gcp, /apps/onboard/aws/state-bootstrap, /modules/aws/kubernetes]
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /apps/onboard/aws
    schedule: { interval: weekly }
